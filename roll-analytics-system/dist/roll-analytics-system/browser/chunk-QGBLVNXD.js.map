<nav class="navbar">
  <div class="navbar-left">
    <button class="mobile-menu-btn" (click)="toggleMobileSidebar()" aria-label="Toggle menu">
      <span class="material-icons">menu</span>
    </button>
    <a class="logo-box client-box" href="#">
      <span class="logo-icon client-icon"></span>
      <span class="logo-text">CLIENT</span>
    </a>
  </div>

  <div class="navbar-center">
    <span class="material-icons title-icon">analytics</span>
    <h1 class="app-title">Roll Analytics System</h1>
  </div>

  <div class="navbar-right">
    <div class="shift-card">
      <span class="shift-badge">A</span>
      <div class="shift-text">
        <span class="shift-label">{{ shiftLabel }}</span>
        <span class="shift-time">{{ shiftTime }}</span>
      </div>
    </div>

    <div class="navbar-divider"></div>

    <a class="icon-btn notification-btn" [routerLink]="['/notifications']" aria-label="Notifications">
      <span class="material-icons">notifications</span>
      <span class="badge" *ngIf="unreadCount > 0"></span>
    </a>

    <div class="avatar" title="AD">
      <span>AD</span>
    </div>

    <a class="logo-box hitachi-box" href="#">
      <span class="logo-icon hitachi-icon">H</span>
      <span class="logo-text">HITACHI</span>
    </a>
  </div>
</nav>
