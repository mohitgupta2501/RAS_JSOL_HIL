<aside
  class="sidebar"
  [class.collapsed]="layoutService.sidebarCollapsed()"
  [class.mobile-open]="layoutService.mobileSidebarOpen()">
  <header class="sidebar-header">
    <div class="header-left" *ngIf="!layoutService.sidebarCollapsed() || layoutService.mobileSidebarOpen()">
      <span class="menu-dot"></span>
      <span class="menu-label">MENU</span>
    </div>
    <button
      class="collapse-btn"
      (click)="toggleSidebar()"
      type="button"
      aria-label="Toggle sidebar">
      <span class="material-icons">{{
        layoutService.sidebarCollapsed() ? 'chevron_right' : 'chevron_left'
      }}</span>
    </button>
  </header>

  <nav class="sidebar-nav">
    <a
      *ngFor="let item of menuItems"
      [routerLink]="item.path"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-item"
      (click)="onNavClick()"
      [attr.title]="layoutService.sidebarCollapsed() ? item.label : null">
      <span class="nav-icon-wrap">
        <span class="material-icons nav-icon">{{ item.icon }}</span>
      </span>
      <span class="nav-label">{{ item.label }}</span>
    </a>
  </nav>

  <footer class="sidebar-footer" *ngIf="!layoutService.sidebarCollapsed() || layoutService.mobileSidebarOpen()">
    <div class="status-row">
      <span class="status-dot"></span>
      <span class="status-text">System Online</span>
    </div>
    <span class="version-text">{{ version }}</span>
  </footer>
</aside>

<div
  class="sidebar-overlay"
  [class.visible]="layoutService.mobileSidebarOpen()"
  (click)="layoutService.closeMobileSidebar()"></div>
